<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Kaffeine — Specialty Café">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&amp;display=swap');</style>
    <radialGradient id="b1" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#7B4422"/>
      <stop offset="45%" stop-color="#4E2208"/>
      <stop offset="100%" stop-color="#1E0C02"/>
    </radialGradient>
    <radialGradient id="b2" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#C07A3A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C07A3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c9a3"/>
      <stop offset="100%" stop-color="#b5a275"/>
    </linearGradient>
  </defs>
  <mask id="stag-m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
    <g fill="#fff">
      <g id="stag-antler">
        <path d="M103 96 Q120 84 132 64 Q141 48 143 30 Q144 20 150 12 Q147 24 146 34 Q143 54 133 72 Q123 88 109 101 Z"/>
        <path d="M116 86 Q116 68 104 56 Q117 64 122 79 Z"/>
        <path d="M126 71 Q126 52 114 38 Q128 52 131 64 Z"/>
        <path d="M133 57 Q134 38 124 22 Q138 39 137 50 Z"/>
        <path d="M143 27 Q151 19 161 11 Q157 24 146 34 Z"/>
        <path d="M137 49 Q148 43 159 40 Q150 53 140 56 Z"/>
        <path d="M123 79 Q136 73 150 70 Q138 83 127 86 Z"/>
      </g>
      <use href="#stag-antler" transform="matrix(-1 0 0 1 200 0)"/>
      <path d="M110 99 Q126 96 139 107 Q124 112 111 107 Z"/>
      <path d="M90 99 Q74 96 61 107 Q76 112 89 107 Z"/>
      <path d="M100 91 C 106 91, 112 95, 113 102 C 115 114, 111 128, 108 142 C 106 154, 105 166, 104 175 C 103 181, 101 185, 100 185 C 99 185, 97 181, 96 175 C 95 166, 94 154, 92 142 C 89 128, 85 114, 87 102 C 88 95, 94 91, 100 91 Z"/>
    </g>
    <g fill="#000">
      <path d="M100 101 C 103 97, 107 98, 107 103 C 107 107, 104 110, 100 113 C 96 110, 93 107, 93 103 C 93 98, 97 97, 100 101 Z"/>
      <path d="M89 117 Q93 113 98 117 Q93 120 89 117 Z"/>
      <path d="M111 117 Q107 113 102 117 Q107 120 111 117 Z"/>
      <path d="M93 132 Q96 130 98 134 Q95 135 93 132 Z"/>
      <path d="M107 132 Q104 130 102 134 Q105 135 107 132 Z"/>
      <path d="M96 154 Q100 151 104 154 Q100 157 96 154 Z"/>
      <path d="M96 170 Q100 167 104 170 Q103 176 100 177 Q97 176 96 170 Z"/>
    </g>
  </mask>
  <!-- stag mark, centered above the wordmark -->
  <g transform="translate(240,4) scale(1.6)">
    <rect width="200" height="200" fill="url(#gold)" mask="url(#stag-m)"/>
  </g>
  <text x="400" y="430" text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="92" font-weight="400" font-style="italic" letter-spacing="18"
    fill="#f3eee3">Kaffeine</text>
  <!-- mask the dot of the i with the page background so the bean replaces it -->
  <rect x="344" y="336" width="32" height="22" fill="#1a1a1a"/>
  <!-- coffee bean as the dot of the i -->
  <g transform="translate(360,358) rotate(-12)">
    <ellipse rx="9.5" ry="13.5" fill="url(#b1)"/>
    <ellipse rx="9.5" ry="13.5" fill="url(#b2)"/>
    <path d="M-0.5-11 C-3-5.5,3-1.5,1,0.5 C-1,2.5,2.5,7,0.5,11"
      stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M1-10.5 C-1.5-5,4-1,2,1 C0,3,3.5,7,1.5,10.5"
      stroke="#A06030" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="400" y="488" text-anchor="middle"
    font-family="Helvetica, Arial, sans-serif"
    font-size="15" font-weight="300" letter-spacing="13"
    fill="#cdbf9f" opacity="0.7">SPECIALTY&#160;&#160;CAFÉ</text>
</svg>
